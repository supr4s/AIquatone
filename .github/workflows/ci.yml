name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -o aiquatone .

      - name: Cross-compile Windows
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: go vet ./... && go build -o aiquatone.exe .
