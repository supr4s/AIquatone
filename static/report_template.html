  <style type="text/css">
    footer {
      border-top: 1px solid rgba(0, 0, 0, .125);
      margin-top: 50px;
      padding: 50px;
      text-align: center;
      font-size: 12px;
      color: rgb(68, 68, 68);
    }

    footer a {
      color: inherit !important;
      text-decoration: underline;
    }

    .carousel {
      margin-bottom: 50px;
    }

    .carousel-item {
      color: #383d41;
      text-align: center;
    }

    .carousel-item .page-card {
      width: 300px;
      text-align: left;
      margin: 25px 10px 55px 10px;
      display: inline-block;
    }

    .single-page-container .page-card,
    .single-page-container .page-headers-table {
      margin: 0px 0px 50px 0px;
    }

    .page-screenshot-container {
      position: relative;
      overflow: hidden;
      border-bottom: 1px solid rgba(0, 0, 0, .125);
    }

    .page-screenshot {
      transition: transform .5s ease-out;
      cursor: zoom-in;
      width: 100%;
    }

    .carousel-control-prev,
    .carousel-control-next {
      width: 5%;
    }

    .carousel-control-prev-icon {
      background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='%236c757d' viewBox='0 0 8 8'%3e%3cpath d='M5.25 0l-4 4 4 4 1.5-1.5-2.5-2.5 2.5-2.5-1.5-1.5z'/%3e%3c/svg%3e");
    }

    .carousel-control-next-icon {
      background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='%236c757d' viewBox='0 0 8 8'%3e%3cpath d='M2.75 0l-1.5 1.5 2.5 2.5-2.5 2.5 1.5 1.5 4-4-4-4z'/%3e%3c/svg%3e");
    }

    .carousel-indicators li {
      background-color: #6c757d;
    }

    .badge {
      margin-right: 5px;
    }

    .page-headers-table {
      width: 100%;
    }

    .page-headers-table td {
      font-family: Anonymous Pro, Consolas, Menlo, Monaco, Lucida Console, Liberation Mono, DejaVu Sans Mono, Bitstream Vera Sans Mono, Courier New, monospace, serif;
    }

    .page-headers-table td.header-value {
      word-break: break-all;
    }

    .single-page-container {
      border-bottom: 1px solid rgba(0, 0, 0, .125);
      margin-bottom: 50px;
    }

    .graph-container {
      position: relative;
      width: 100%;
      height: 700px;
      margin-top: 20px;
      border: 1px solid rgba(0, 0, 0, .125);
    }

    .graph {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .graph-loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 9999;
      background-color: #ffffff;
      text-align: center;
      padding-top: 25%;
    }

    .graph-loading-overlay .progress {
      margin-left: auto;
      margin-right: auto;
      width: 50%;
      height: 35px;
    }

    .show-more-button {
      margin-top: 50px;
      margin-bottom: 50px;
    }

    #screenshotModal .page-screenshot {
      width: 100%;
      cursor: pointer;
    }

    .filter-tabs .nav-link {
      cursor: pointer;
    }

    .filter-tabs .nav-link.active {
      font-weight: bold;
    }

    .filter-tab-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .filter-tab-header h4 {
      margin: 0;
    }

    .export-btn {
      margin-left: 10px;
    }

    .tag-filter-container {
      margin-top: 20px;
    }

    .tag-badge-filter {
      cursor: pointer;
      margin: 3px;
      padding: 8px 14px;
      font-size: 14px;
      display: inline-block;
    }

    .tag-badge-filter.active {
      box-shadow: 0 0 0 3px rgba(0,123,255,.5);
    }

    .filtered-urls-list {
      margin-top: 20px;
    }

    .filtered-urls-list .url-item {
      padding: 8px 12px;
      border-bottom: 1px solid rgba(0,0,0,.125);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .filtered-urls-list .url-item:hover {
      background-color: #f8f9fa;
    }

    .url-count-badge {
      font-size: 12px;
      margin-left: 8px;
    }

    .badge-juicy {
      background-color: #6f42c1;
      color: #fff;
    }
    .badge-juicy.active {
      background-color: #007bff;
    }
    .feature-url-card {
      border: 1px solid rgba(0,0,0,.125);
      border-radius: 4px;
      margin-bottom: 10px;
      padding: 10px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      transition: background-color 0.15s;
    }

    .feature-url-card:hover {
      background-color: #f8f9fa;
    }

    .feature-url-card.selected {
      background-color: #e3f2fd;
      border-color: #90caf9;
    }

    .feature-url-card .card-checkbox {
      margin-top: 4px;
      cursor: pointer;
      width: 18px;
      height: 18px;
    }

    .feature-url-card .card-screenshot {
      width: 200px;
      min-width: 200px;
      height: 120px;
      object-fit: cover;
      object-position: top left;
      border-radius: 3px;
      cursor: zoom-in;
      border: 1px solid rgba(0,0,0,.1);
    }

    .feature-url-card .card-info {
      flex: 1;
      min-width: 0;
    }

    .feature-url-card .card-url {
      word-break: break-all;
      font-size: 14px;
    }

    .feature-url-card .card-tags {
      margin-top: 4px;
    }

    .feature-selection-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding: 8px 12px;
      background: #f8f9fa;
      border-radius: 4px;
    }

    .feature-no-screenshot {
      background: #e9ecef;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #6c757d;
      font-size: 12px;
    }
  </style>

          <li :data-target="'#carousel_' + id" v-for="(pageGroup, index) in pagesInGroups" :data-slide-to="index" :class="{ 'active': index === 0 }"></li>
        </ol>
        <div class="carousel-inner">
          <div class="carousel-item" v-for="(pageGroup, index) in pagesInGroups" :class="{ 'active': index === 0 }">
            <page-card v-for="page in pageGroup" v-bind:page="page" v-bind:key="page.uuid"></page-card>
          </div>

          <a class="carousel-control-prev" :href="'#carousel_' + id" role="button" data-slide="prev">

            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="sr-only">Next</span>
          </a>
        </div>
        <hr />
    </div>
  </script>

  <script type="text/x-template" id="pageHeadersTableTemplate">
    <table class="table table-striped table-hover table-sm page-headers-table">

          <td class="header-name">${ header.name }</td>
          <td class="header-value">${ header.value }</td>
        </tr>
      </tbody>
    </table>
  </script>

  <script type="text/x-template" id="singlePageTemplate">

        <div class="col-4">
          <page-card v-bind:page="page"></page-card>

        <div class="col-8">
          <page-headers-table v-bind:headers="page.headers"></page-headers-table>
        </div>
    </div>

  <script type="text/x-template" id="pagesBySimilarityPageTemplate">
    <div>
      <h2 class="display-4 text-center border-bottom pb-3">Pages by Similarity</h2>
      <div v-if="clusterIndex - 1 < pageSimilarityClusters.length" v-for="clusterIndex in clustersToShow">
        <page-carousel v-bind:id="pageSimilarityClusters[clusterIndex - 1].uuid" v-bind:pages="pageSimilarityClusters[clusterIndex - 1].pages"
          v-bind:key="pageSimilarityClusters[clusterIndex - 1].uuid">
        </page-carousel>
      </div>
      <button @click="clustersToShow += 15" :disabled="clustersToShow >= pageSimilarityClusters.length" class="btn btn-primary btn-lg btn-block show-more-button">Show More</button>
    </div>
  </script>

  <script type="text/x-template" id="pagesByHostsPageTemplate">
    <div>
      <h2 class="display-4 text-center border-bottom pb-3">Pages by Hosts</h2>
      <div v-if="clusterIndex - 1 < pagesByHosts.length" v-for="clusterIndex in clustersToShow">
        <page-carousel v-bind:id="pagesByHosts[clusterIndex - 1].id" v-bind:pages="pagesByHosts[clusterIndex - 1].pages"
          v-bind:key="pagesByHosts[clusterIndex - 1].id">
        </page-carousel>
      </div>
      <button @click="clustersToShow += 15" :disabled="clustersToShow >= pagesByHosts.length" class="btn btn-primary btn-lg btn-block show-more-button">Show More</button>
    </div>
  </script>

  <script type="text/x-template" id="singlePagesPageTemplate">
    <div>
      <h2 class="display-4 text-center border-bottom pb-3">Pages</h2>
      <div v-if="pageIndex - 1 < pages.length" v-for="pageIndex in pagesToShow">
        <single-page v-bind:id="pages[pageIndex - 1].uuid" v-bind:page="pages[pageIndex - 1]" v-bind:key="pages[pageIndex - 1].uuid"></single-page>
      </div>
      <button @click="pagesToShow += 15" :disabled="pagesToShow >= pages.length" class="btn btn-primary btn-lg btn-block show-more-button">Show More</button>
    </div>
  </script>

  <script type="text/x-template" id="graphPageTemplate">
    <div class="graph-container">
      <div class="graph" id="graph"></div>
      <div class="graph-loading-overlay" id="graphLoadingOverlay">
        <h3>Loading graph...</h3>
        <div class="progress">
          <div class="progress-bar bg-info" id="graphProgress" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="2500"></div>
        </div>
      </div>
    </div>
  </script>

  <script type="text/x-template" id="technologiesPageTemplate">
    <div>
      <h2 class="display-4 text-center border-bottom pb-3">Technologies</h2>
      <div class="tag-filter-container">
        <div class="mb-3">
          <span v-for="tech in sortedTechnologies"
                class="badge tag-badge-filter"
                :class="selectedTech === tech.name ? 'badge-primary active' : 'badge-secondary'"
                @click="selectTech(tech.name)">
            ${ tech.name } <span class="badge badge-light url-count-badge">${ tech.count }</span>
          </span>
        </div>

        <div v-if="selectedTech" class="filtered-urls-list">
          <div class="filter-tab-header">
            <h4>${ selectedTech } <span class="badge badge-info">${ filteredPages.length } URLs</span></h4>
            <button class="btn btn-sm btn-outline-success export-btn" @click="copyURLs(selectedTech, filteredPages)">
              <span v-if="copySuccess">Copied!</span><span v-else>Copy URLs</span>
            </button>
          </div>
          <div v-for="page in filteredPages" class="url-item">
            <a :href="page.url" target="_blank">${ page.url }</a>
            <span :class="'badge badge-pill ' + badgeClassForStatus(page.status)">${ page.status }</span>
          </div>
        </div>
        <div v-else class="text-center text-muted mt-5">
          <h5>Select a technology to see matching URLs</h5>
        </div>
      </div>
    </div>
  </script>

  <script type="text/x-template" id="featuresPageTemplate">
    <div>
      <h2 class="display-4 text-center border-bottom pb-3">${ title }</h2>
      <p v-if="subtitle" class="text-center text-muted">${ subtitle }</p>
      <div class="tag-filter-container">
        <div class="mb-3">
          <span v-for="feat in sortedFeatures"
                class="badge tag-badge-filter"
                :class="featureBadgeClass(feat)"
                @click="selectFeature(feat.name)">
            ${ feat.name } <span class="badge badge-light url-count-badge">${ feat.count }</span>
          </span>
        </div>

        <div v-if="selectedFeature || (showAllByDefault && filteredPages.length > 0)" class="filtered-urls-list">
          <div class="filter-tab-header">
            <h4>${ selectedFeature || allLabel } <span class="badge badge-info">${ filteredPages.length } URLs</span></h4>
            <div>
              <button class="btn btn-sm btn-outline-success export-btn" @click="copyURLs(selectedFeature, filteredPages)">
                <span v-if="copySuccess">Copied!</span><span v-else>Export All URLs</span>
              </button>
            </div>
          </div>
          <div class="feature-selection-bar">
            <div>
              <input type="checkbox" :checked="allSelected" @change="toggleSelectAll" style="margin-right:6px;cursor:pointer;">
              <span v-if="selectedUrls.length > 0">${ selectedUrls.length } selected</span>
              <span v-else>Select all</span>
            </div>
            <button v-if="selectedUrls.length > 0" class="btn btn-sm btn-success" @click="copySelected">
              <span v-if="copySelectedSuccess">Copied!</span><span v-else>Copy Selected (${selectedUrls.length})</span>
            </button>
          </div>
          <div v-for="page in filteredPages" :key="page.url" class="feature-url-card" :class="{selected: isSelected(page.url)}">
            <input type="checkbox" class="card-checkbox" :checked="isSelected(page.url)" @change="toggleSelect(page.url)">
            <img v-if="page.hasScreenshot" :src="page.screenshotPath" class="card-screenshot" @click="openScreenshot(page)" :alt="page.url">
            <div v-else class="card-screenshot feature-no-screenshot">No screenshot</div>
            <div class="card-info">
              <div class="card-url">
                <a :href="page.url" target="_blank">${ page.url }</a>
              </div>
              <div v-if="page.pageTitle" style="font-size:12px;color:#495057;margin-top:2px;" :title="page.pageTitle">
                ${ page.pageTitle.length > 90 ? page.pageTitle.slice(0, 90) + '…' : page.pageTitle }
              </div>
              <div v-if="getRedirectTag(page)" style="font-size:12px;color:#6c757d;margin-top:2px;">
                <em>${ getRedirectTag(page).text }</em>
              </div>
              <div class="card-tags">
                <span :class="'badge badge-pill ' + badgeClassForStatus(page.status)">${ page.status }</span>
                <span v-for="tag in getDisplayTags(page)" :class="'badge badge-pill ml-1 ' + badgeClassForTag(tag)">${ tag.text }</span>
              </div>
            </div>
          </div>
        </div>
        <div v-else class="text-center text-muted mt-5">
          <h5>${ emptyHint }</h5>
        </div>
      </div>
    </div>
  </script>

  <script type="text/javascript">
    function parseSession(session) {
      let data = {
        version: session.version,
        stats: session.stats,
        pages: [],
        pageSimilarityClusters: []
      }
      for (let pageUrl in session.pages) {
        data.pages.push(session.pages[pageUrl]);
      }
      for (let uuid in session.pageSimilarityClusters) {
        let cluster = {
          uuid: uuid,
          pages: []
        }
        for (let pageUrl of session.pageSimilarityClusters[uuid]) {
          cluster.pages.push(session.pages[pageUrl])
        }
        data.pageSimilarityClusters.push(cluster);
      }
      data.pageSimilarityClusters.sort((a, b) => {
        return a.pages.length - b.pages.length;
      });
      return data;
    }

    Vue.component('PagesBySimilarityPage', {
      template: '#pagesBySimilarityPageTemplate',
      delimiters: ['${', '}'],
      data() {
        return {
          clustersToShow: 100
        }
      },
      props: {
        pageSimilarityClusters: Array
      }
    });

    Vue.component('PagesByHostsPage', {
      template: '#pagesByHostsPageTemplate',
      delimiters: ['${', '}'],
      data() {
        return {
          clustersToShow: 100
        }
      },
      props: {
        pages: Array
      },
      computed: {
        pagesByHosts() {
          result = {}
          for (let page of this.pages) {
            if (page.hostname in result) {
              result[page.hostname].pages.push(page);
            } else {
              result[page.hostname] = {
                id: _.uniqueId('host-cluster_'),
                pages: [page]
              }
            }
          }
          return _.values(result);
        }
      }
    });

    Vue.component('SinglePagesPage', {
      template: '#singlePagesPageTemplate',
      delimiters: ['${', '}'],
      data() {
        return {
          pagesToShow: 100
        }
      },
      props: {
        pages: Array
      }
    });

    Vue.component('GraphPage', {
      template: '#graphPageTemplate',
      delimiters: ['${', '}'],
      props: {
        pages: Array,
        pageSimilarityClusters: Array
      },
      computed: {
        makeDatasets() {
          let nodes = {};
          let edges = [];

          for (let page of this.pages) {
            pageId = `page_${page.uuid}`;
            nodes[pageId] = {
              id: pageId,
              label: page.url,
              group: 'page',
              value: 1
            };

            if (page.tags) {
              for (let tag of page.tags) {
                let tagId = `tag_${tag.hash}`;
                if (!(tagId in nodes)) {
                  nodes[tagId] = {
                    id: tagId,
                    label: tag.text,
                    group: 'tag',
                    value: 1,
                  };
                } else {
                  nodes[tagId].value += 3;
                }
                edges.push({
                  from: pageId, to: tagId
                });
              }
            }

            if (page.addrs) {
              for (let addr of page.addrs) {
                let addrId = `addr_${addr}`;
                if (!(addrId in nodes)) {
                  nodes[addrId] = {
                    id: addrId,
                    label: addr,
                    group: 'addr',
                    value: 1
                  };
                } else {
                  nodes[addrId].value += 3
                }
                edges.push({
                  from: pageId, to: addrId
                });
              }
            }
          }

          for (let cluster of this.pageSimilarityClusters) {
            if (cluster.pages.length <= 1) {
              continue;
            }

            clusterId = `cluster_${cluster.uuid}`;
            nodes[clusterId] = {
              id: clusterId,
              label: 'Similar',
              group: 'similarity',
              value: 1 + (cluster.pages.length * 3)
            };

            for (page of cluster.pages) {
              edges.push({
                from: `page_${page.uuid}`, to: clusterId
              });
            }
          }


          return [new vis.DataSet(_.values(nodes)), new vis.DataSet(edges)]
        }
      },
      mounted: function () {
        this.$nextTick(() => {
          $('#footer').hide();
          $('#graphLoadingOverlay').show();
          let datasets = this.makeDatasets;
          let data = {
            nodes: datasets[0],
            edges: datasets[1]
          }
          let progress = $('#graphProgress');

          let network = new vis.Network($('#graph')[0], data, {
            layout: {
              improvedLayout: false,
            },
            nodes: {
              shape: 'dot',
            },
            edges: {
              color: { inherit: 'to' },
              smooth: false,
            },
            physics: {
              enabled: false,
              forceAtlas2Based: {
                springLength: 230,
                springConstant: 0.18
              },
              maxVelocity: 146,
              solver: 'forceAtlas2Based',
              timestep: 0.35,
              stabilization: {
                enabled: true,
                iterations: 2500,
                updateInterval: 25
              },
            },
            groups: {
              'page': {
                color: '#28a745'
              },
              'tag': {
                color: '#007bff'
              },
              'addr': {
                color: '#17a2b8'
              },
              'similarity': {
                color: '#ffc107'
              }
            }
          });

          network.on('stabilizationProgress', (params) => {
            let percentage = (params.iterations / params.total) * 100;
            progress.attr('aria-valuenow', params.iterations).css('width', `${percentage}%`);
          });

          network.once('stabilizationIterationsDone', () => {
            progress.attr('aria-valuenow', 2500).css('width', '100%');
            $('#graphLoadingOverlay').hide();
          });

          network.stabilize(2500);
        });
      },
      destroyed: function () {
        this.$nextTick(() => {
          $('#footer').show();
        });
      }
    });

    Vue.component('TechnologiesPage', {
      template: '#technologiesPageTemplate',
      delimiters: ['${', '}'],
      data() {
        return {
          selectedTech: null,
          copySuccess: false
        }
      },
      props: {
        pages: Array
      },
      computed: {
        sortedTechnologies() {
          let techs = {};
          for (let page of this.pages) {
            if (!page.tags) continue;
            for (let tag of page.tags) {
              if (tag.type !== 'info') continue;
              if (techs[tag.text]) {
                techs[tag.text]++;
              } else {
                techs[tag.text] = 1;
              }
            }
          }
          return Object.keys(techs).map(name => ({name: name, count: techs[name]})).sort((a, b) => b.count - a.count);
        },
        filteredPages() {
          if (!this.selectedTech) return [];
          return this.pages.filter(page => {
            if (!page.tags) return false;
            return page.tags.some(tag => tag.type === 'info' && tag.text === this.selectedTech);
          });
        }
      },
      methods: {
        selectTech(name) {
          this.selectedTech = this.selectedTech === name ? null : name;
        },
        copyURLs(name, pages) {
          let urls = pages.map(p => p.url).join('\n');
          navigator.clipboard.writeText(urls).then(() => {
            this.copySuccess = true;
            setTimeout(() => { this.copySuccess = false; }, 2000);
          });
        },
        badgeClassForStatus(status) {
          if (!status) return 'badge-secondary';
          let code = parseInt(status);
          if (code >= 500) return 'badge-danger';
          if (code >= 400) return 'badge-warning';
          if (code >= 300) return 'badge-info';
          if (code >= 200) return 'badge-success';
          return 'badge-secondary';
        }
      }
    });

    // Generic "group pages by tag" view. Used for the Features tab
    // (feature + danger tags, with a virtual Uncategorized bucket) and the
    // Interesting Titles tab (one badge per juicy keyword found in <title>).
    Vue.component('FeaturesPage', {
      template: '#featuresPageTemplate',
      delimiters: ['${', '}'],
      data() {
        return {
          selectedFeature: null,
          copySuccess: false,
          copySelectedSuccess: false,
          selectedUrls: []
        }
      },
      props: {
        pages: Array,
        title: { type: String, default: 'Features' },
        subtitle: { type: String, default: '' },
        emptyHint: { type: String, default: 'Select a feature to see matching URLs' },
        tagTypes: { type: Array, default: () => ['feature', 'danger'] },
        showUncategorized: { type: Boolean, default: true },
        // When true, every page carrying one of tagTypes is listed as soon
        // as the tab opens; clicking a badge narrows the list to one tag.
        showAllByDefault: { type: Boolean, default: false },
        allLabel: { type: String, default: 'All' }
      },
      computed: {
        allSelected() {
          return this.filteredPages.length > 0 && this.selectedUrls.length === this.filteredPages.length;
        },
        sortedFeatures() {
          let feats = {};
          let featsType = {};
          let categorizedUrls = new Set();
          let featureTypes = this.tagTypes;
          for (let page of this.pages) {
            let hasCategoryTag = false;
            if (page.tags) {
              for (let tag of page.tags) {
                if (featureTypes.indexOf(tag.type) !== -1) {
                  if (feats[tag.text]) {
                    feats[tag.text]++;
                  } else {
                    feats[tag.text] = 1;
                    featsType[tag.text] = tag.type;
                  }
                  hasCategoryTag = true;
                }
              }
            }
            if (hasCategoryTag) {
              categorizedUrls.add(page.url);
            }
          }
          let uncatCount = 0;
          for (let page of this.pages) {
            if (!categorizedUrls.has(page.url)) {
              uncatCount++;
            }
          }
          let result = Object.keys(feats).map(name => ({name: name, count: feats[name], tagType: featsType[name]})).sort((a, b) => b.count - a.count);
          if (this.showUncategorized && uncatCount > 0) {
            result.push({name: 'Uncategorized', count: uncatCount, tagType: 'uncategorized'});
          }
          return result;
        },
        filteredPages() {
          let featureTypes = this.tagTypes;
          if (!this.selectedFeature) {
            if (!this.showAllByDefault) return [];
            // Pages with the most matching keywords first, then by URL.
            let countTags = page => (page.tags || []).filter(tag => featureTypes.indexOf(tag.type) !== -1).length;
            return this.pages
              .filter(page => countTags(page) > 0)
              .sort((a, b) => countTags(b) - countTags(a) || a.url.localeCompare(b.url));
          }
          if (this.selectedFeature === 'Uncategorized') {
            return this.pages.filter(page => {
              if (!page.tags) return true;
              return !page.tags.some(tag => featureTypes.indexOf(tag.type) !== -1);
            });
          }
          return this.pages.filter(page => {
            if (!page.tags) return false;
            return page.tags.some(tag => featureTypes.indexOf(tag.type) !== -1 && tag.text === this.selectedFeature);
          });
        }
      },
      watch: {
        selectedFeature() {
          this.selectedUrls = [];
        },
        // The router reuses this component between the Features and
        // Interesting Titles routes; reset the selection when switching.
        title() {
          this.selectedFeature = null;
          this.selectedUrls = [];
        }
      },
      methods: {
        featureBadgeClass(feat) {
          if (this.selectedFeature === feat.name) return 'badge-primary active';
          if (feat.tagType === 'uncategorized') return 'badge-secondary';
          if (feat.tagType === 'danger') return 'badge-danger';
          if (feat.tagType === 'interesting') return 'badge-juicy';
          return 'badge-warning';
        },
        badgeClassForTag(tag) {
          if (tag.type === 'danger') return 'badge-danger';
          if (tag.type === 'feature') return 'badge-warning';
          if (tag.type === 'interesting') return 'badge-juicy';
          return 'badge-secondary';
        },
        selectFeature(name) {
          this.selectedFeature = this.selectedFeature === name ? null : name;
        },
        isSelected(url) {
          return this.selectedUrls.indexOf(url) !== -1;
        },
        toggleSelect(url) {
          let idx = this.selectedUrls.indexOf(url);
          if (idx !== -1) {
            this.selectedUrls.splice(idx, 1);
          } else {
            this.selectedUrls.push(url);
          }
        },
        toggleSelectAll() {
          if (this.allSelected) {
            this.selectedUrls = [];
          } else {
            this.selectedUrls = this.filteredPages.map(p => p.url);
          }
        },
        copyURLs(name, pages) {
          let urls = pages.map(p => p.url).join('\n');
          navigator.clipboard.writeText(urls).then(() => {
            this.copySuccess = true;
            setTimeout(() => { this.copySuccess = false; }, 2000);
          });
        },
        copySelected() {
          let urls = this.selectedUrls.join('\n');
          navigator.clipboard.writeText(urls).then(() => {
            this.copySelectedSuccess = true;
            setTimeout(() => { this.copySelectedSuccess = false; }, 2000);
          });
        },
        getRedirectTag(page) {
          if (!page.tags) return null;
          return page.tags.find(t => t.type === 'redirect') || null;
        },
        getDisplayTags(page) {
          if (!page.tags) return [];
          return page.tags.filter(t => t.type !== 'info' && t.type !== 'redirect');
        },
        openScreenshot(page) {
          let modalTemplate = $("#screenshotModal");
          modalTemplate.find('.modal-title').text(page.url);
          modalTemplate.find('.screenshot-link').attr('href', page.screenshotPath);
          modalTemplate.find('.page-screenshot').attr('src', page.screenshotPath).attr('alt', page.url);
          modalTemplate.modal('show');
        },
        badgeClassForStatus(status) {
          if (!status) return 'badge-secondary';
          let code = parseInt(status);
          if (code >= 500) return 'badge-danger';
          if (code >= 400) return 'badge-warning';
          if (code >= 300) return 'badge-info';
          if (code >= 200) return 'badge-success';
          return 'badge-secondary';
        }
      }
    });

    Vue.component('NotFoundPage', {
      template: "<h1>Ooops. Don't know where that is.</h1>"
    });

    Vue.component('page-carousel', {
      template: '#pageCarouselTemplate',
      delimiters: ['${', '}'],
      props: {
        id: String,
        pages: Array,
      },
      computed: {
        pagesInGroups() {
          return _.chunk(this.pages, 3);
        }
      }
    });

    Vue.component('page-card', {
      template: '#PageCardTemplate',
      delimiters: ['${', '}'],
      props: {
        page: Object
      },
      methods: {
        badgeClassForStatus() {
          let statusCode = parseInt(/^(\d+)\s/.exec(this.page.status)[0]);
          if (statusCode > 499) {
            return 'badge-danger';
          } else if (statusCode > 399) {
            return 'badge-warning';
          } else if (statusCode > 299) {
            return 'badge-info';
          } else if (statusCode > 199) {
            return 'badge-success';
          } else {
            return 'badge-secondary';
          }
        },
        redirectTag() {
          if (!this.page.tags) return null;
          return this.page.tags.find(t => t.type === 'redirect') || null;
        },
        nonRedirectTags() {
          if (!this.page.tags) return [];
          return this.page.tags.filter(t => t.type !== 'redirect');
        },
        badgeClassForTag(tag) {
          if (tag.type === 'feature') return 'badge-warning';
          if (tag.type === 'danger') return 'badge-danger';
          if (tag.type === 'interesting') return 'badge-juicy';
          return 'badge-info';
        },
        zoomScreenshot(event) {
          $(event.target).css({ 'transform': 'scale(2)' });
        },
        unzoomScreenshot(event) {
          $(event.target).css({ 'transform': 'scale(1)' });
        },
        alignZoomWithCursor(event) {
          let container = $(event.target).closest('.page-screenshot-container');
          $(event.target).css({ 'transform-origin': ((event.pageX - container.offset().left) / container.width()) * 100 + '% ' + ((event.pageY - container.offset().top) / container.height()) * 100 + '%' });
        },
        openScreenshotModal(event) {
          event.preventDefault();
          let modalTemplate = $("#screenshotModal");
          modalTemplate.find('.modal-title').text(this.page.url);
          modalTemplate.find('.screenshot-link').attr('href', this.page.screenshotPath);
          modalTemplate.find('.page-screenshot').attr('src', this.page.screenshotPath).attr('alt', this.page.url);
          modalTemplate.modal('show');
        },
        openDetailsModal(event) {
          event.preventDefault();
          let modalTemplate = $("#detailsModal");
          let res = Vue.compile('<page-headers-table v-bind:headers="headers"></page-headers-table>');
          new Vue({
            data: {
              headers: this.page.headers
            },
            render: res.render,
            staticRenderFns: res.staticRenderFns
          }).$mount('#detailsModal .page-headers-table');
          modalTemplate.find('.modal-title').text(this.page.url);
          modalTemplate.find('.visit-page-button').attr('href', this.page.url);
          modalTemplate.find('.view-raw-headers-button').attr('href', this.page.headersPath);
          modalTemplate.find('.view-raw-response-button').attr('href', this.page.bodyPath);
          modalTemplate.modal('show');
        }
      }
    });

    Vue.component('page-headers-table', {
      template: '#pageHeadersTableTemplate',
      delimiters: ['${', '}'],
      props: {
        headers: Array
      },
      methods: {
        classForHeader(header) {
          if (header.increasesSecurity) {
            return 'table-success';
          } else if (header.decreasesSecurity) {
            return 'table-warning';
          }
          return '';
        }
      }
    });

    Vue.component('single-page', {
      template: '#singlePageTemplate',
      delimiters: ['${', '}'],
      props: {
        page: Object
      }
    })

    const session = {{.}};
    const data = _.extend(parseSession(session), { currentRoute: window.location.hash });
    const router = new VueRouter({
      routes: [
        { path: '/', alias: '/pages/by-similarity', component: Vue.component('PagesBySimilarityPage'), props: { pageSimilarityClusters: data.pageSimilarityClusters } },
        { path: '/pages/by-hosts', component: Vue.component('PagesByHostsPage'), props: { pages: data.pages } },
        { path: '/pages/single', component: Vue.component('SinglePagesPage'), props: { pages: data.pages } },
        { path: '/pages/graph', component: Vue.component('GraphPage'), props: { pages: data.pages, pageSimilarityClusters: data.pageSimilarityClusters } },
        { path: '/pages/technologies', component: Vue.component('TechnologiesPage'), props: { pages: data.pages } },
        { path: '/pages/features', component: Vue.component('FeaturesPage'), props: { pages: data.pages } },
        { path: '/pages/interesting-titles', component: Vue.component('FeaturesPage'), props: { pages: data.pages, title: 'Interesting Titles', subtitle: 'Pages whose <title> contains a triage keyword (admin, dev, preprod, intranet, jenkins, vpn, backup, ...). Click a keyword to filter, click it again to show all.', emptyHint: 'No page title contains a triage keyword', tagTypes: ['interesting'], showUncategorized: false, showAllByDefault: true, allLabel: 'All interesting titles' } },
        { path: '/pages/stats', component: Vue.component('StatsPage'), props: { pages: data.pages, pageSimilarityClusters: data.pageSimilarityClusters, stats: data.stats } },
        { path: '*', component: Vue.component('NotFoundPage') }
      ]
    })

    var app = new Vue({
      el: '#app',
      data: data,
      delimiters: ['${', '}'],
      router: router
    });
  </script>

  <div class="modal fade" tabindex="-1" role="dialog" aria-hidden="true" id="screenshotModal">
    <div class="modal-dialog modal-xl">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"></h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <a href="" target="_blank" class="screenshot-link"><img class="page-screenshot" src="" alt="" /></a>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" tabindex="-1" role="dialog" aria-hidden="true" id="detailsModal">
    <div class="modal-dialog modal-xl">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"></h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <h3>Response Headers:</h3>
